# nginx serves the built samples showcase (samples-dist/) as plain static files
# and reverse-proxies the four WebSocket endpoints to the `ws` node sidecar
# (tools/serve.ts → server-dist/tools/serve.js). Static serving is nginx's job;
# only the live networking endpoints cross into node.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Resolve the `ws` sidecar via Docker's embedded DNS AT REQUEST TIME. A static
  # `upstream`/bare hostname is resolved at config-load, so if `ws` isn't up yet
  # nginx dies with "host not found in upstream" and crash-loops — taking the
  # whole static site down with it. The resolver + variable proxy_pass defers
  # lookup to the request, turning a boot crash into a recoverable 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Standard WebSocket upgrade plumbing.
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Networking samples' endpoints → the node sidecar (WebSocket upgrade).
    location ~ ^/ws-(echo|relay|signal|road-rivals)$ {
      # Variable forces request-time DNS resolution (see resolver above).
      set $ws_backend ws:8765;
      proxy_pass http://$ws_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;   # long-lived sockets: don't cut idle players
    }

    # ESM modules aren't in the default mime map on every nginx build.
    location ~* \.mjs$ { default_type text/javascript; }

    # Everything else is a static file; directories fall back to index.html.
    location / { try_files $uri $uri/ =404; }
  }
}
