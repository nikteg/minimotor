<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dual Canvas - Minimotor</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Each canvas sizes to its half (`fullscreen: false`). */
      .half {
        height: 50vh;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="half"><canvas id="game"></canvas></div>
    <div class="half"><canvas id="game2"></canvas></div>
    <script type="module" src="./dual-canvas.ts"></script>
  </body>
</html>
